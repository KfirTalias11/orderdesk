server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { access_log off; return 200 'ok'; }
    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ =404; }
}
